plugins {
    id 'java'
    id 'org.springframework.boot' version '3.1.0'
    id 'io.spring.dependency-management' version '1.1.0'
}

group = 'org.gnori'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '21'

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

bootJar {
    archiveBaseName = 'books-market'
    archiveVersion = '1.0.0'
    archiveFileName  = "$project.name".concat(".jar")
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
    implementation("com.fasterxml.uuid:java-uuid-generator:5.2.0")
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    implementation 'io.jsonwebtoken:jjwt-impl:0.11.5'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.11.5'
    implementation 'commons-io:commons-io:2.11.0'
    implementation 'org.apache.commons:commons-lang3:3.14.0'
    implementation 'org.liquibase:liquibase-core:4.33.0'

    implementation 'jakarta.json:jakarta.json-api:2.1.1'
    implementation 'org.glassfish:jakarta.json:2.0.1'
    implementation 'io.minio:minio:8.5.7'

    compileOnly 'org.springframework.boot:spring-boot-starter-actuator'

    implementation 'org.projectlombok:lombok:1.18.32'
    compileOnly 'org.projectlombok:lombok:1.18.32'
    annotationProcessor 'org.projectlombok:lombok:1.18.32'

    implementation 'org.postgresql:postgresql'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation platform('org.testcontainers:testcontainers-bom:1.19.3')
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
}

tasks.register('test-unit', Test) {
    useJUnitPlatform {
        excludeTags 'e2e'  
    } 
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true 
    }

    reports {
        html {
            required = true
            outputLocation = layout.buildDirectory.dir('reports/tests/test-unit')
        }
    }
}

tasks.register('test-e2e', Test) {
    useJUnitPlatform {
        includeTags 'e2e'
    }

    systemProperty 'testcontainers.properties.file',
        "${projectDir}/.testcontainers.properties"

    shouldRunAfter 'test-unit'
    
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true 
    }

    reports {
        html {
            required = true
            outputLocation = layout.buildDirectory.dir('reports/tests/test-e2e')
        }
    }
}

tasks.named('test') {
    dependsOn 'test-unit', 'test-e2e'
}
